{% extends "itfd_creator/base_tools.html" %}

{% block tools_content %}
<h1>Edit Monster</h1>

<form id="monster-form" method="post" action="/itfd-creator/packs/{{ pack }}/edit-monster/{{monster_id}}">
    <h2>Monster bearbeiten</h2>

    <div>
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" value="{{ monster[0] }}" required>
    </div>

    <div>
        <label for="strength">Strength:</label>
        <input type="number" id="strength" name="strength" min="0" step="1" value="{{ monster[1] }}" required>
    </div>

    <div>
        <label for="health">Health:</label>
        <input type="number" id="health" name="health" min="0" step="1" value="{{ monster[2] }}" required>
    </div>

    <div>
        <label for="xp">XP:</label>
        <input type="number" id="xp" name="xp" min="0" step="1" value="{{ monster[3] }}" required>
    </div>

    <hr>

    <!-- Items -->
    <fieldset>
        <legend>Items:</legend>
        <div id="items-list">
            {% for item in monster[4] %}
            <div class="item-row">
                <select name="items" required>
                    <option value="" disabled>-- Select Item --</option>
                    {% for i in possible_items %}
                        <option value="{{ i[0] }}" {% if i[0] == item %}selected{% endif %}>
                            {{ i[0] }}: {{ i[1] }}
                        </option>
                    {% endfor %}
                </select>
                <button type="button" class="remove-btn" aria-label="Item entfernen">✕</button>
            </div>
            {% endfor %}
        </div>
        <button type="button" id="add-item-btn">+ Add Item</button>
    </fieldset>

    <hr>

    <!-- Sentences -->
    <fieldset>
        <legend>Sentences:</legend>
        <div id="sentences-list">
            {% for sentence in monster[5] %}
            <div class="sentence-row">
                <input type="text" name="sentences" value="{{ sentence }}" required>
                <button type="button" class="remove-btn" aria-label="Satz entfernen">✕</button>
            </div>
            {% endfor %}
        </div>
        <button type="button" id="add-sentence-btn">+ Add Sentence</button>
    </fieldset>

    <hr>

    <button type="submit">Update Monster</button>
</form>

<!-- Templates für neue Zeilen -->
<template id="item-row-tpl">
    <div class="item-row">
        <select name="items" required></select>
        <button type="button" class="remove-btn" aria-label="Item entfernen">✕</button>
    </div>
</template>

<template id="sentence-row-tpl">
    <div class="sentence-row">
        <input type="text" name="sentences" placeholder="Satz" required>
        <button type="button" class="remove-btn" aria-label="Satz entfernen">✕</button>
    </div>
</template>

<script>
(function() {
    const possible_items = {{ possible_items | default([]) | tojson | safe }};

    const itemsList = document.getElementById('items-list');
    const sentencesList = document.getElementById('sentences-list');
    const itemTpl = document.getElementById('item-row-tpl');
    const sentenceTpl = document.getElementById('sentence-row-tpl');

    function fillSelect(select) {
        if (possible_items.length) {
            select.innerHTML = `
                <option value="" disabled selected>-- Select Item --</option>
                ${possible_items.map(i => `<option value="${i[0]}">${i[0]}: ${i[1]}</option>`).join('')}
            `;
        } else {
            select.innerHTML = `<option value="">No items available</option>`;
            select.disabled = true;
        }
    }

    function addItemRow() {
        const node = itemTpl.content.firstElementChild.cloneNode(true);
        fillSelect(node.querySelector('select'));
        itemsList.appendChild(node);
    }

    function addSentenceRow() {
        const node = sentenceTpl.content.firstElementChild.cloneNode(true);
        sentencesList.appendChild(node);
    }

    // Event Delegation: funktioniert für vorhandene & neue Zeilen
    itemsList.addEventListener('click', (e) => {
        const btn = e.target.closest('.remove-btn');
        if (!btn) return;
        const row = btn.closest('.item-row');
        if (row && itemsList.contains(row)) row.remove();
    });

    sentencesList.addEventListener('click', (e) => {
        const btn = e.target.closest('.remove-btn');
        if (!btn) return;
        const row = btn.closest('.sentence-row');
        if (row && sentencesList.contains(row)) row.remove();
    });

    document.getElementById('add-item-btn').addEventListener('click', addItemRow);
    document.getElementById('add-sentence-btn').addEventListener('click', addSentenceRow);
})();
</script>
{% endblock %}
