{% extends "itfd_creator/base_tools.html" %}

{% block tools_content %}
<h1>Items</h1>


<table border="1" cellpadding="8" cellspacing="0">
    <thead>
        <tr>
            <th>Number</th>
            <th>Name</th>
            <th>Category</th>
            <th>a</th>
            <th>b</th>
            <th>c</th>
            <th>d</th>
            <th>e</th>
            <th>Actions</th>
        </tr>
    </thead>
    <tbody>
        {% for item in items %}
        <tr>
            <td>{{ item[0] }}</td>
            <td>{{ item[1] }}</td>
            <td>{{ item[2] }}</td>
            <td>{{ item[3] }}</td>
            <td>{{ item[4] }}</td>
            <td>{{ item[5] }}</td>
            <td>{{ item[6] }}</td>
            <td>{{ item[7] }}</td>
            <td>
                <!-- Edit Button -->
                <form method="get" action="/itfd-creator/pack/{{ pack }}/edit-item/{{ item[0] }}" style="display:inline;">
                    <button type="submit">Edit</button>
                </form>

                <!-- Delete Button -->
                <form method="post" action="/itfd-creator/pack/{{ pack }}/delete-item/{{ item[0] }}" style="display:inline;">
                    <button type="submit" onclick="return confirm('Are you sure you want to delete this item?');">
                        Delete
                    </button>
                </form>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>

<a href="/itfd-creator/pack/{{ pack }}/add-item">Add Item</a>

{% endblock %}
