{% extends "itfd_creator/base_tools.html" %}

{% block tools_content %}
<h1>Willkommen beim Tool Creator</h1>
<p>Hier kannst du Packs auswählen oder ein neues erstellen:</p>

<form method="post" action="/itfd-creator/add-pack">
    <label>
        <input type="radio" name="pack_option" value="existing" checked>
        Edit a Pack
    </label>
    <label>
        <input type="radio" name="pack_option" value="new">
        Create a new pack
    </label>

    <div id="existingDiv">
        <select id="existing_pack" name="existing_pack">
            {% for pack in packs %}
            <option value="{{ pack }}">{{ pack }}</option>
            {% endfor %}
        </select>
    </div>

    <div id="newDiv" style="display:none;">
        <input type="text" id="new_pack" name="new_pack" placeholder="New Pack">
    </div>

    <br>
    <input type="submit" value="Save">
</form>

<script>
    const radios = document.getElementsByName('pack_option');
    const existingDiv = document.getElementById('existingDiv');
    const newDiv = document.getElementById('newDiv');

    radios.forEach(radio => {
        radio.addEventListener('change', function() {
            if(this.value === 'existing') {
                existingDiv.style.display = 'block';
                newDiv.style.display = 'none';
            } else {
                existingDiv.style.display = 'none';
                newDiv.style.display = 'block';
            }
        });
    });
</script>
{% endblock %}
